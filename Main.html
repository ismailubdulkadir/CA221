  <meta charset="UTF-8">
  <title>JUST University</title>
  <style>
 
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f6f9;
      margin: 0;
      padding: 0;
      color: #333;
    }
    div{
      width: 200px;
      height: 150px;
    }

    h1 {
      background-color: #004080;
      color: white;
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    h2 {
      color: #004080;
      margin-top: 30px;
      text-align: center;
    }

    

    ul {
      max-width: 800px;
      margin: 0 auto 30px;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      list-style-type: disc;
    }

    ul li {
      margin: 10px 0;
    }

    a {
      display: inline-block;
      text-decoration: none;
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      margin: 20px auto;
      text-align: center;
      transition: background-color 0.3s;
    }

    a:hover {
      background-color: #0066cc;
    }

    a:visited {
      color: white;
    }

    .back-link {
      display: flex;
      justify-content: center;
    }
    p {
      text-align: center;
      max-width: 800px;
      margin: 10px auto 20px;
      font-size: 150px;
    }
